<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="公开的信息与资讯更新。"><title>信息站 · Wabicat</title>
<style>
:root{color-scheme:dark;--ink:#e7edf5;--muted:#a5b2c2;--line:#334155;--paper:#0b1220;--surface:#121d2e;--blue:#8fc5ff;--mint:#183f43;--focus:#78b7ff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(125deg,#101b2b,#172c47 62%,#174047);color:#f8fbff;padding:48px 22px 40px;border-bottom:1px solid #334155}.wrap{max-width:900px;margin:auto}header .eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#a8c6df}h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.1;margin:.45rem 0}.subtitle{max-width:650px;color:#d0dbea;margin:14px 0 0}main{max-width:900px;margin:30px auto;padding:0 22px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.toolbar input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;background:#101a29;color:var(--ink)}.toolbar input::placeholder{color:#91a0b3}.toolbar input:focus{outline:2px solid var(--focus);outline-offset:2px}.count{color:var(--muted);font-size:.9rem}#items{display:grid;gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 24px #0005}.meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.83rem}.tag{background:var(--mint);color:#b5f0df;border:1px solid #28645d;border-radius:100px;padding:2px 10px}.card h2{font-size:1.28rem;line-height:1.35;margin:12px 0 6px;color:#f2f6fc}.summary{font-weight:600;margin:0 0 10px;color:#dbe5f1}.body{white-space:pre-wrap;color:#c2cddd;margin:0}.source{display:inline-block;margin-top:14px;color:var(--blue);font-weight:650;text-decoration:none}.source:hover{text-decoration:underline;color:#b8dcff}.empty,.error{background:var(--surface);border:1px dashed #53647a;border-radius:14px;padding:26px;color:var(--muted);text-align:center}.error{color:#ffaaa9}.foot{color:var(--muted);font-size:.83rem;margin:34px 0 24px;text-align:center}a{overflow-wrap:anywhere}a:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:3px}@media(max-width:560px){body{line-height:1.7}header{padding:28px 16px 24px}main{margin:20px auto;padding:0 14px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:16px}.toolbar input{width:100%;min-width:0;min-height:48px}.count{font-size:.84rem}#items{gap:12px}.card{padding:16px;border-radius:12px}.meta{flex-wrap:wrap;gap:6px 10px;align-items:flex-start}.meta time{flex-basis:100%}.card h2{font-size:1.22rem;line-height:1.38;margin:12px 0 8px}.summary{font-size:.98rem;line-height:1.65}.body{font-size:.96rem;line-height:1.8;overflow-wrap:anywhere}.body h3{font-size:1.05rem;line-height:1.45;margin:1.25em 0 .45em}.body p{margin:.65em 0}.body ul{padding-left:1.2em;margin:.5em 0 1em}.body li{margin:.35em 0}.source{min-height:44px;display:inline-flex;align-items:center}.foot{margin:24px 0;font-size:.82rem}}@media(min-width:390px) and (max-width:560px){.toolbar{grid-template-columns:minmax(0,1fr) auto}.count{white-space:nowrap;align-self:center}}


@media(max-width:560px){body{line-height:1.7}header{padding:28px 16px 24px}main{margin:20px auto;padding:0 14px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:16px}.toolbar input{width:100%;min-width:0;min-height:48px}.count{font-size:.84rem}#items{gap:12px}.card{padding:16px;border-radius:12px}.meta{flex-wrap:wrap;gap:6px 10px;align-items:flex-start}.meta time{flex-basis:100%}.card h2{font-size:1.22rem;line-height:1.38;margin:12px 0 8px}.summary{font-size:.98rem;line-height:1.65}.body{font-size:.96rem;line-height:1.8;overflow-wrap:anywhere}.body h3{font-size:1.05rem;line-height:1.45;margin:1.25em 0 .45em}.body p{margin:.65em 0}.body ul{padding-left:1.2em;margin:.5em 0 1em}.body li{margin:.35em 0}.source{min-height:44px;display:inline-flex;align-items:center}.foot{margin:24px 0;font-size:.82rem}}@media(min-width:390px) and (max-width:560px){.toolbar{grid-template-columns:minmax(0,1fr) auto}.count{white-space:nowrap;align-self:center}}.item-content{position:relative;overflow:hidden}.item-content.is-collapsed{max-height:6.9em}.item-content.is-collapsed:after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.8em;background:linear-gradient(transparent,var(--surface));pointer-events:none}.expand-toggle,.load-more{border:1px solid #45627f;border-radius:9px;background:#17283b;color:var(--blue);font:inherit;font-weight:650;padding:10px 14px;min-height:44px;cursor:pointer}.expand-toggle{margin-top:7px}.expand-toggle:hover,.load-more:hover{background:#203a55}.expand-toggle:focus-visible,.load-more:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.load-row{text-align:center;margin:22px 0 0}.load-more[hidden]{display:none}.load-more:disabled{opacity:.65;cursor:wait}
</style></head><body><header><div class="wrap"><div class="eyebrow">WABICAT · 信息与发现</div><h1>信息站</h1><p class="subtitle">把值得留意的新闻、旅行灵感和实用信息，整理在一个清爽易读的地方。</p></div></header><main><div class="toolbar"><input id="search" type="search" placeholder="搜索标题、摘要或正文…" aria-label="搜索信息"><span id="count" class="count"></span></div><section id="items" aria-live="polite"><div class="empty">正在载入…</div></section><div class="load-row"><button id="load-more" class="load-more" type="button" hidden>加载更多</button></div><p class="foot">内容通过公开 JSON API 更新 · <a href="/api/items">查看 API 数据</a></p></main>
<script>
const list=document.querySelector('#items'),search=document.querySelector('#search'),count=document.querySelector('#count'),more=document.querySelector('#load-more');const PAGE_SIZE=5;let all=[],offset=0,total=0,hasMore=false,loading=false,requestVersion=0,searchTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(raw){return esc(raw).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function renderBody(raw){const lines=String(raw||'').replace(/\r\n?/g,'\n').split('\n'),out=[];let paragraph=[],inList=false;const flush=()=>{if(paragraph.length){out.push('<p>'+inline(paragraph.join(' '))+'</p>');paragraph=[]}},closeList=()=>{if(inList){out.push('</ul>');inList=false}};for(const line of lines){const text=line.trim();if(!text){flush();closeList();continue}const heading=text.match(/^#{2,4}\s+(.+)$/);if(heading){flush();closeList();out.push('<h3>'+inline(heading[1])+'</h3>');continue}const bullet=text.match(/^-\s+(.+)$/);if(bullet){flush();if(!inList){out.push('<ul>');inList=true}out.push('<li>'+inline(bullet[1])+'</li>');continue}closeList();paragraph.push(text)}flush();closeList();return out.join('')}
function render(){if(!all.length){list.innerHTML='<div class="empty">'+(search.value.trim()?'没有匹配的内容。':'这里还没有发布内容，之后的资讯会显示在这里。')+'</div>';return}list.innerHTML=all.map((item,i)=>'<article class="card"><div class="meta"><span class="tag">'+esc(item.category||'资讯')+'</span><time>'+esc(new Date(item.publishedAt).toLocaleString('zh-CN',{dateStyle:'medium',timeStyle:'short'}))+'</time></div><h2>'+esc(item.title)+'</h2><div class="item-content is-collapsed" id="item-content-'+i+'">'+(item.summary?'<p class="summary">'+esc(item.summary)+'</p>':'')+(item.body?'<div class="body">'+renderBody(item.body)+'</div>':'')+'</div><button class="expand-toggle" type="button" aria-expanded="false" aria-controls="item-content-'+i+'">展开全文</button>'+(item.sourceUrl?'<a class="source" href="'+esc(item.sourceUrl)+'" target="_blank" rel="noopener noreferrer">阅读来源 ↗</a>':'')+'</article>').join('')}
list.addEventListener('click',event=>{const button=event.target.closest('.expand-toggle');if(!button)return;const content=document.getElementById(button.getAttribute('aria-controls')),expanded=button.getAttribute('aria-expanded')!=='true';content.classList.toggle('is-collapsed',!expanded);button.setAttribute('aria-expanded',String(expanded));button.textContent=expanded?'收起':'展开全文'});
async function load(reset=false){if(loading)return;loading=true;const version=++requestVersion;if(reset){offset=0;all=[];total=0;hasMore=false;list.innerHTML='<div class="empty">正在载入…</div>'}more.disabled=true;more.textContent='正在载入…';try{const query=search.value.trim(),url='/api/items?limit='+PAGE_SIZE+'&offset='+(reset?0:offset)+'&q='+encodeURIComponent(query),response=await fetch(url);if(!response.ok)throw Error('载入失败');const data=await response.json();if(version!==requestVersion)return;const rows=Array.isArray(data.items)?data.items:[];if(reset)all=rows;else all=all.concat(rows);offset=Number(data.offset??offset)+rows.length;total=Number(data.total??all.length);hasMore=Boolean(data.hasMore);count.textContent=(query?'匹配 ':'')+total+' 条信息';render();more.hidden=!hasMore;more.textContent='加载更多';}catch(error){if(version===requestVersion){if(reset)list.innerHTML='<div class="error">暂时无法载入信息，请稍后再试。</div>';more.hidden=true}}finally{if(version===requestVersion){loading=false;more.disabled=false}}}
search.addEventListener('input',()=>{clearTimeout(searchTimer);requestVersion++;loading=false;searchTimer=setTimeout(()=>load(true),220)});more.addEventListener('click',()=>load(false));load(true);
</script>
</body></html>
